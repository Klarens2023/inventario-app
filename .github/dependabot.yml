# Dependabot: abre pull requests cuando hay versiones nuevas de las dependencias.
# Las actualizaciones de SEGURIDAD llegan aparte y de inmediato si en GitHub
# está activo Settings → Code security → Dependabot security updates.
version: 2
updates:
  # Paquetes de npm (package.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      # Parches y versiones menores juntos en un solo PR por semana
      menores:
        update-types: [minor, patch]
    ignore:
      # Saltos de versión mayor (Next 16, React 20, etc.) se planean a mano
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Acciones usadas en .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
